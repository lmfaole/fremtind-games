name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm verify
            - run: pnpm build
              env:
                  NEXT_PUBLIC_API_URL: https://api.fremtind.games
                  # Offentlig, skrivebeskyttet prosjekttoken. Trygt i klientkode.
                  NEXT_PUBLIC_POSTHOG_TOKEN: phc_tmXRaeuJPXnu2Qy3w9mVYHVJwzjnRAzB7s9mB92c3iMQ
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
