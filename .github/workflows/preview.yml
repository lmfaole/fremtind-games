name: Preview

# Forhåndsvisning på Cloudflare Pages: `dev` får fast adresse, og hver pull request får sin egen.
# GitHub Pages kan bare ha ett nettsted per repo (produksjon), derfor Cloudflare her.

on:
    push:
        branches: [dev]
    pull_request:
        branches: [dev]
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: preview-${{ github.head_ref || github.ref_name }}
    cancel-in-progress: true

env:
    PROJECT: fremtind-games-preview

jobs:
    preview:
        runs-on: ubuntu-latest
        environment:
            name: preview
            url: ${{ steps.deploy.outputs.deployment-url }}
        env:
            # Secrets kan ikke brukes direkte i `if`. Mangler de (f.eks. PR fra fork), hoppes deploy over.
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Bevisst uten NEXT_PUBLIC_API_URL og NEXT_PUBLIC_POSTHOG_TOKEN: testing i preview
            # skal ikke forurense statistikk eller atferdsdata i produksjon.
            - run: pnpm build
            - name: Hold forhåndsvisningen utenfor søkemotorer
              run: |
                  printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > out/_headers
            - name: Opprett Pages-prosjekt hvis det mangler
              if: env.CLOUDFLARE_API_TOKEN != ''
              run: npx wrangler@4 pages project create "$PROJECT" --production-branch=main || true
            - id: deploy
              if: env.CLOUDFLARE_API_TOKEN != ''
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  command: pages deploy out --project-name=${{ env.PROJECT }} --branch=${{ github.head_ref || github.ref_name }}
            - name: Legg lenken i pull requesten
              if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
                  URL: ${{ steps.deploy.outputs.deployment-url }}
              run: |
                  gh pr comment ${{ github.event.pull_request.number }} --body "Forhåndsvisning: $URL"
            - name: Mangler Cloudflare-secrets
              if: env.CLOUDFLARE_API_TOKEN == ''
              run: |
                  echo "::notice::Hoppet over deploy. Legg inn CLOUDFLARE_API_TOKEN og CLOUDFLARE_ACCOUNT_ID, se docs/deploy.md."
